name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DynamicIsland.sln -c Release

      # Một file .exe chạy luôn, không cần cài .NET.
      - name: Publish
        run: >
          dotnet publish src/DynamicIsland/DynamicIsland.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: publish/DynamicIsland.exe
