name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Số phiên bản lấy từ <Version> trong DynamicIsland.csproj.
      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/DynamicIsland/DynamicIsland.csproj -XPath '//Version').Node.InnerText
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build DynamicIsland.sln -c Release

      # Một file .exe chạy luôn, không cần cài .NET.
      - name: Publish
        run: >
          dotnet publish src/DynamicIsland/DynamicIsland.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - name: Name file with version
        shell: pwsh
        run: Rename-Item publish/DynamicIsland.exe "DynamicIsland-$env:VERSION.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-${{ env.VERSION }}-win-x64
          path: publish/DynamicIsland-${{ env.VERSION }}.exe

      # Đẩy tag v* (vd. v0.3.0) thì tạo trang Release để tải về, không cần đăng nhập GitHub.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dynamic Island ${{ env.VERSION }}
          files: publish/DynamicIsland-${{ env.VERSION }}.exe
          generate_release_notes: true
